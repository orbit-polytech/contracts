[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "orbit-contracts"
version = "0.1.0"
description = "Protobuf and gRPC stubs for Orbit Polytech ecosystem"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "protobuf>=5.29.3,<6",
    "grpcio>=1.68.0,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["gen/python/orbit"]
