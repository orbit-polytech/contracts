version: "3"

tasks:
  lint:
    desc: "Run buf lint"
    cmds:
      - buf lint

  format:
    desc: Format proto files with buf
    cmds:
      - buf format -w

  format-check:
    desc: Verify proto formatting
    cmds:
      - buf format -d --exit-code

  generate:
    desc: Generate Go code from protobuf files
    cmds:
      - cmd: powershell -NoProfile -Command "if (Test-Path gen/go) { Remove-Item -Recurse -Force gen/go }"
        platforms: [windows]
      - cmd: rm -rf gen/go
        platforms: [linux, darwin]
      - buf generate
      - go mod tidy
      - go build ./gen/go/...

  check:
    desc: Run all verifications (lint, format-check, generate, and drift check)
    cmds:
      - task: lint
      - task: format-check
      - task: generate
      - cmd: powershell -NoProfile -Command "$diff = git status --porcelain gen/go; if ($diff) { Write-Error 'Drift detected in gen/go'; exit 1 }"
        platforms: [windows]
      - cmd: test -z "$(git status --porcelain gen/go)"
        platforms: [linux, darwin]
