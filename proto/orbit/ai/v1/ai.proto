syntax = "proto3";

package orbit.ai.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/orbit-polytech/contracts/gen/go/orbit/ai/v1;aiv1";

service AIService {
  rpc ChatStream(ChatStreamRequest) returns (stream ChatStreamResponse);
  rpc CancelGeneration(CancelGenerationRequest) returns (CancelGenerationResponse);
  rpc GetConversations(GetConversationsRequest) returns (GetConversationsResponse);
  rpc GetConversationHistory(GetConversationHistoryRequest) returns (GetConversationHistoryResponse);
  rpc DeleteConversation(DeleteConversationRequest) returns (DeleteConversationResponse);
  rpc SubmitFeedback(SubmitFeedbackRequest) returns (SubmitFeedbackResponse);
}

message StudentContext {
  string group_title = 1;
  string faculty = 2;
  int32 course = 3;
}

message SourceCitation {
  string document_title = 1;
  string section = 2;
  string url = 3;
  float relevance_score = 4;
  string excerpt = 5;
}

enum ChunkStage {
  CHUNK_STAGE_UNSPECIFIED = 0;
  CHUNK_STAGE_START = 1;
  CHUNK_STAGE_DELTA = 2;
  CHUNK_STAGE_CITATIONS = 3;
  CHUNK_STAGE_DONE = 4;
  CHUNK_STAGE_ERROR = 5;
  CHUNK_STAGE_CANCELLED = 6;
  CHUNK_STAGE_RETRIEVAL = 7;
}

message ChatStreamRequest {
  string conversation_id = 1;
  string message_id = 2;
  string query = 3;
  StudentContext context = 4;
  string model = 5;
  string user_id = 6;
}

message ChatStreamResponse {
  ChunkStage stage = 1;
  string delta_text = 2;
  repeated SourceCitation citations = 3;
  string error_message = 4;
  int32 error_code = 5;
  string conversation_id = 6;
  string message_id = 7;
  int64 duration_ms = 8;
  int32 retry_after_sec = 9;
}

message CancelGenerationRequest {
  string conversation_id = 1;
  string message_id = 2;
}

message CancelGenerationResponse {
  bool cancelled = 1;
}

message ConversationSummary {
  string id = 1;
  string title = 2;
  google.protobuf.Timestamp created_at = 3;
  google.protobuf.Timestamp updated_at = 4;
  int32 messages_count = 5;
  string last_message_snippet = 6;
}

enum FeedbackRating {
  FEEDBACK_RATING_UNSPECIFIED = 0;
  FEEDBACK_RATING_UP = 1;
  FEEDBACK_RATING_DOWN = 2;
}

message ChatMessage {
  string id = 1;
  string role = 2;
  string content = 3;
  repeated SourceCitation citations = 4;
  google.protobuf.Timestamp created_at = 5;
  int64 duration_ms = 6;
  FeedbackRating feedback_rating = 7;
  string feedback_reason = 8;
}

message GetConversationsRequest {
  string user_id = 1;
  int32 limit = 2;
  int32 offset = 3;
}

message GetConversationsResponse {
  repeated ConversationSummary conversations = 1;
  int32 total_count = 2;
}

message GetConversationHistoryRequest {
  string user_id = 1;
  string conversation_id = 2;
  int32 limit = 3;
}

message GetConversationHistoryResponse {
  string conversation_id = 1;
  repeated ChatMessage messages = 2;
}

message DeleteConversationRequest {
  string user_id = 1;
  string conversation_id = 2;
}

message DeleteConversationResponse {
  bool success = 1;
}

message SubmitFeedbackRequest {
  string user_id = 1;
  string conversation_id = 2;
  string message_id = 3;
  FeedbackRating rating = 4;
  string reason = 5;
  string comment = 6;
}

message SubmitFeedbackResponse {
  bool saved = 1;
  FeedbackRating rating = 2;
  string reason = 3;
}
