syntax = "proto3";

package orbit.auth.v1;

import "google/protobuf/timestamp.proto";
import "orbit/auth/v1/identity.proto";
import "orbit/auth/v1/oauth.proto";

option go_package = "github.com/orbit-polytech/contracts/gen/go/orbit/auth/v1;authv1";

service AuthService {
  rpc SendCode(SendCodeRequest) returns (SendCodeResponse);
  rpc VerifyCode(VerifyCodeRequest) returns (VerifyCodeResponse);
  rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenResponse);
  rpc Logout(LogoutRequest) returns (LogoutResponse);

  rpc BeginOAuthLogin(BeginOAuthLoginRequest) returns (BeginOAuthLoginResponse);
  rpc FinishOAuthLogin(FinishOAuthLoginRequest) returns (FinishOAuthLoginResponse);

  rpc BeginIdentityLink(BeginIdentityLinkRequest) returns (BeginIdentityLinkResponse);
  rpc FinishIdentityLink(FinishIdentityLinkRequest) returns (FinishIdentityLinkResponse);
  rpc ListLinkedIdentities(ListLinkedIdentitiesRequest) returns (ListLinkedIdentitiesResponse);
  rpc UnlinkIdentity(UnlinkIdentityRequest) returns (UnlinkIdentityResponse);
}

message SendCodeRequest {
  string email = 1;
}

message SendCodeResponse {
  int32 retry_after_seconds = 1;
  int32 expires_in_seconds = 2;
}

message VerifyCodeRequest {
  string email = 1;
  string code = 2;
  string client_ip = 3;
  string user_agent = 4;
}

message VerifyCodeResponse {
  string access_token = 1;
  string refresh_token = 2;
  string user_id = 3;
  google.protobuf.Timestamp access_token_expires_at = 4;
  google.protobuf.Timestamp refresh_token_expires_at = 5;
  bool is_new_user = 6;
}

message RefreshTokenRequest {
  string refresh_token = 1;
  string client_ip = 2;
  string user_agent = 3;
}

message RefreshTokenResponse {
  string access_token = 1;
  string refresh_token = 2;
  google.protobuf.Timestamp access_token_expires_at = 3;
  google.protobuf.Timestamp refresh_token_expires_at = 4;
}

message LogoutRequest {
  string refresh_token = 1;
}

message LogoutResponse {}
